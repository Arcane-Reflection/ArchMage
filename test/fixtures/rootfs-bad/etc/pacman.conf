# NEGATIVE fixture for tools/checks/assert-shipping-discipline.sh (01-03).
#
# This is deliberately WRONG in every way the discipline checker must catch.
# It is NOT a usable pacman.conf and must never be copied into an image.
#
# Violations planted on purpose:
#   1. "TrustAll" appears — once active, once in a comment (T-01-10: a
#      commented TrustAll is one edit away from shipping and must fail).
#   2. [core] sets SigLevel = TrustAll (forbidden token, package level not
#      Required, ALARM DatabaseOptional policy broken).
#   3. [linuxphoneos] weakens the own-repo policy with DatabaseOptional.
#   4. usr/lib/firmware/qcom/a5068/fake-firmware.mbn — a Qualcomm-shaped
#      blob that no linux-firmware package owns (no local db in the fixture
#      => empty whitelist => must fail).

[options]
HoldPkg = pacman glibc
# T-01-10 regression: TrustAll left behind from a debugging session and
# merely commented out — factory files must not carry it even like this.
#SigLevel = TrustAll
SigLevel = Required DatabaseOptional

[core]
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
SigLevel = TrustAll

[extra]
Include = /etc/pacman.d/mirrorlist

[community]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

[linuxphoneos]
# Own repos ship signed databases; DatabaseOptional is a policy breach here.
SigLevel = Required DatabaseOptional
Server = https://repo.linuxphoneos.org/staging/aarch64
