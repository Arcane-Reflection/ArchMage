# pacman.conf for verifying the linuxphoneOS CI staging-repo artifact locally.
#
# Usage:
#   gh run download -n staging-repo -D /tmp/staging-repo
#   gpg --import /tmp/staging-repo/staging-key.asc
#   gpg --verify /tmp/staging-repo/cn.db.tar.zst.sig /tmp/staging-repo/cn.db.tar.zst
#   pacman -Sy --config test/fixtures/pacman-verify.conf
#
# (The db-level signature is also verifiable with plain gpg as above; to
# make pacman itself verify per-package signatures, import the key into the
# pacman keyring used by this config: pacman-key --config ... --lsign-key.)
#
# Signature discipline (PITFALLS 2): the staging repo ships a SIGNED
# database (repo-add -s, per-package sigs embedded via --include-sigs).
# Upstream ALARM repos keep SigLevel = Required DatabaseOptional (ALARM
# does not distribute signed databases); linuxphoneOS repos are strict:
# Required. "SigLevel TrustAll" is forbidden anywhere in this project.

[options]
HoldPkg = pacman glibc
# Keep verification self-contained; no writes to the host root filesystem.
DBPath  = /tmp/verify-db/
LogFile = /tmp/pacman-verify.log

[staging]
SigLevel = Required DatabaseOnly
Server = file:///tmp/staging-repo
