# alarm-pacman.conf — minimal pacman config used ONLY to sync the ALARM
# aarch64 repository databases into a dedicated dbpath
# (tools/nvchecker/alarm-db/, gitignored) for nvchecker's `alpm` source
# (nvchecker.toml entries 9-12). No packages are ever installed from here
# (upstream-check.sh runs `pacman -Sy` only); SigLevel Required
# DatabaseOptional follows the project's shipped-config discipline.
#
# NOTE the ALARM mirror layout is $arch/$repo (arch FIRST), the reverse of
# mainline Arch's $repo/$arch — a $repo/$arch URL 404s silently in
# `pacman -Sy` output and leaves a stale/empty db (RESEARCH Pitfalls:
# stale db quietly reports old versions; upstream-check.sh re-syncs every
# run and records the sync timestamp in drift-report.md, T-04-05).

[options]
HoldPkg = pacman glibc
Architecture = aarch64
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo

[extra]
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
