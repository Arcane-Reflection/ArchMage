# /usr/lib/environment.d/10-archmage-ime.conf — ArchMage IME defaults
# (03-01; applies to systemd user sessions; the IM-03 input matrix rows
# mirror exactly this factory env).
#
# GTK_IM_MODULE is deliberately NOT set: GTK3/4 talk to fcitx5 through the
# native Wayland text-input-v3 protocol (fcitx5 waylandim). Setting it would
# downgrade GTK to the legacy D-Bus input path.
#
# QT_IM_MODULE value is `fcitx`, NOT `fcitx5` (classic misconfiguration;
# Qt5 < 6.7 has no text-input-v3 client, so it needs the fcitx5-qt plugin).
XMODIFIERS=@im=fcitx
QT_IM_MODULE=fcitx
# Qt6 >= 6.7 preference list (semicolon-separated): native Wayland
# text-input-v3 first, then the fcitx plugin, then ibus compatibility.
QT_IM_MODULES=wayland;fcitx;ibus
