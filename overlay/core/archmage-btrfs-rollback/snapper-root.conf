# snapper root 配置模板(archmage-btrfs-rollback)
# 应用者:archmage-btrfs-rollback.install scriptlet(btrfs 根上,应用前
# 先由 snapper create-config 生成配置,再以本模板覆盖限额键)。
#
# UPDATE-01 机器面(03-03):
#   - NUMBER_LIMIT=5:数字快照封顶 5。滚动 Arch + snap-pac = 一天 2+ 快照,
#     无上限的快照列表会写穿 eMMC(PITFALLS 6)。
#   - NUMBER_LIMIT_IMPORTANT=5:重要快照同样封顶(不做双标准)。
#   - TIMELINE_CREATE=no:timeline 快照关闭——快照只由 pacman 事务
#     (snap-pac)产生,可预期、可审计。
#   - ALLOW_* 保持 snapper 默认(空):快照创建不放开给普通用户。
#
# 布局前提(pmbootstrap !2233 平坦子卷布局,03-03 定义者):
#   - SUBVOLUME=/ 的根以「默认子卷」方式挂载(fstab 根行不含 subvol=);
#   - 快照存储在 @ 之外:@snapshots 子卷挂载于 /.snapshots。
# 根挂载若带命名 subvol= 令牌,snapper rollback 无效
# (BTRFS_IOC_DEFAULT_SUBVOL 被忽略——03-RESEARCH Q3 回滚语义陷阱)。

SUBVOLUME="/"
FSTYPE="btrfs"

# 快照保留限额(UPDATE-01)
NUMBER_LIMIT="5"
NUMBER_LIMIT_IMPORTANT="5"

# timeline 快照关闭
TIMELINE_CREATE="no"
TIMELINE_LIMIT_HOURLY="0"
TIMELINE_LIMIT_DAILY="0"
TIMELINE_LIMIT_WEEKLY="0"
TIMELINE_LIMIT_MONTHLY="0"
TIMELINE_LIMIT_YEARLY="0"

# 清理:数字快照由 snapper-cleanup.timer 按 NUMBER_LIMIT 清理
# (snap-pac 创建快照时自带 cleanup=number 算法标记)。
EMPTY_PRE_POST_CLEANUP="no"

# 访问控制保持 snapper 默认(空 = 仅 root)
ALLOW_USERS=""
ALLOW_GROUPS=""
ALLOW_EMPTY_PRE_POST="no"

# 空间保护(snapper 内建,保留默认值即可,此处显式化)
SPACE_LIMIT="0.2"
FREE_LIMIT="0.2"
